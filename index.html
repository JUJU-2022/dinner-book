<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>晚餐记一笔</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f6fa;margin:0;color:#222}main{max-width:520px;margin:auto;padding:22px}h1{font-size:27px}.card{background:white;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 2px 12px #00000008}label{display:block;margin:12px 0 6px;color:#555}input{width:100%;box-sizing:border-box;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:18px}button{border:0;background:#1677ff;color:white;border-radius:12px;padding:14px;font-size:16px;width:100%;margin-top:14px}.muted{color:#777;font-size:13px}.stats{display:flex;gap:12px}.stats div{flex:1}.num{font-size:24px;font-weight:700}li{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px}ul{padding:0;list-style:none}small{color:#777}.secondary{background:#e9eef8;color:#235}.danger{background:#fff0f0;color:#b33}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#f59e0b"></head><body><main><h1>🍽️ 晚餐记一笔</h1><p class="muted">默认今天 · 可补记昨天或更早日期 · 数据仅保存在当前设备</p><section class="card"><label for="mealDate">用餐日期</label><div style="display:flex;gap:8px;align-items:center"><input id="mealDate" type="date" style="flex:1;min-width:0"><button type="button" class="secondary" style="width:auto;white-space:nowrap;margin:0" onclick="setYesterday()">昨天</button><button type="button" class="secondary" style="width:auto;white-space:nowrap;margin:0" onclick="setToday()">今天</button></div><label for="restaurant">餐厅名称</label><input id="restaurant" placeholder="例如：海底捞" autocomplete="off"><label for="amount">消费金额（元）</label><input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="例如：168"><button onclick="add()">保存这一笔</button></section><section class="card stats"><div><small>本周合计</small><div class="num" id="week">¥0</div></div><div><small>本月合计</small><div class="num" id="month">¥0</div></div></section><section class="card"><strong>最近记录</strong><ul id="list"></ul><button class="secondary" onclick="exportCSV()">导出 Excel 可打开的 CSV</button><button class="secondary" onclick="backup()">备份数据（JSON）</button><label for="importFile">恢复备份</label><input type="file" id="importFile" accept="application/json,.json" onchange="restore(event)"><p class="muted">清除 Safari 网站数据、换手机或更换浏览器可能丢失记录，请定期备份。</p></section></main><script>const key='dinner_records_v1';let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(data))data=[]}catch(e){data=[]}const pad=x=>String(x).padStart(2,'0');function day(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function setToday(){document.getElementById("mealDate").value=day(new Date())}function setYesterday(){let d=new Date();d.setDate(d.getDate()-1);document.getElementById("mealDate").value=day(d)}function save(){localStorage.setItem(key,JSON.stringify(data));render()}function add(){let r=document.getElementById('restaurant').value.trim(),a=Number(document.getElementById('amount').value),chosen=document.getElementById('mealDate').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(chosen)||chosen>day(new Date())){alert('请选择今天或更早的有效日期');return}if(!r||!Number.isFinite(a)||a<=0){alert('请填写餐厅和有效金额');return}data.unshift({id:Date.now()+Math.random(),date:chosen,restaurant:r,amount:Math.round(a*100)/100});save();document.getElementById('restaurant').value='';document.getElementById('amount').value='';setToday();alert('已保存')}function render(){let now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),monday=new Date(today);monday.setDate(today.getDate()-(today.getDay()+6)%7);let w=0,m=0;for(let x of data){if(x.date>=day(monday)&&x.date<=day(today))w+=x.amount;if(x.date.slice(0,7)===day(today).slice(0,7))m+=x.amount}document.getElementById('week').textContent='¥'+w.toFixed(2);document.getElementById('month').textContent='¥'+m.toFixed(2);let ul=document.getElementById('list');ul.replaceChildren();for(let x of data.slice(0,30)){let li=document.createElement('li'),left=document.createElement('span'),right=document.createElement('span'),del=document.createElement('button');left.textContent=x.date+' · '+x.restaurant;right.textContent='¥'+Number(x.amount).toFixed(2);del.textContent='删除';del.className='danger';del.style.width='auto';del.style.padding='5px 8px';del.style.margin='0';del.onclick=()=>{if(confirm('删除这笔记录？')){data=data.filter(y=>y.id!==x.id);save()}};li.append(left,right,del);ul.append(li)}}function download(name,body,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([body],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportCSV(){let esc=x=>'"'+String(x).replaceAll('"','""')+'"';download('晚餐记账.csv','\ufeff日期,餐厅,金额\r\n'+data.map(x=>[x.date,x.restaurant,x.amount].map(esc).join(',')).join('\r\n'),'text/csv;charset=utf-8')}function backup(){download('晚餐记账备份.json',JSON.stringify(data,null,2),'application/json')}async function restore(e){let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v)||!v.every(x=>typeof x.date==='string'&&typeof x.restaurant==='string'&&Number.isFinite(x.amount)))throw Error();if(confirm('用备份替换当前所有记录？')){data=v;save()}}catch(e){alert('备份文件格式不正确')}}setToday();render()</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script></body></html>
